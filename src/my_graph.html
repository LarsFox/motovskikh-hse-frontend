<!DOCTYPE html>
<html>
  <head>
    <title>Интерактивные графы</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.23.0/cytoscape.min.js"></script>
    <style>
      body {
        padding: 20px;
        font-family: Arial, sans-serif;
        background-color: #202021db;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      h1 {
        text-align: center;
        margin-bottom: 30px;
        color: #ffffff;
      }

      .main-container {
        display: grid;
        gap: 40px;
        max-width: 650px;
        width: 100%;
      }

      .sample-row {
        display: flex;
        justify-content: center;
        width: 100%;
      }

      /* Sample карточка */
      .sample-container {
        background-color: rgb(255, 246, 253);
        padding: 15px;
        border-radius: 8px;
        box-shadow: 0 3px 12px rgba(0, 0, 0, 0.4);
        transition: all 0.3s ease;
        width: 300px;
      }

      .sample-container:hover {
        transform: translateY(-3px);
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.6);
      }

      .graphs-container {
        display: grid;
        grid-template-columns: 300px 300px;
        gap: 40px;
      }

      .left-column,
      .right-column {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      /* .graph-container.selected {
        background-color: #4caf50 !important;
        box-shadow: 0 3px 15px rgba(76, 175, 80, 0.5) !important;
      } */

      .graph-container {
        background-color: rgb(255, 246, 253);
        padding: 15px;
        border-radius: 8px;
        box-shadow: 0 3px 12px rgba(0, 0, 0, 0.4);
        transition: all 0.3s ease;
        /* cursor: pointer; */
      }

      .graph-container:hover {
        transform: translateY(-3px);
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.6);
      }

      .graph-title {
        text-align: center;
        margin-bottom: 10px;
        font-size: 16px;
        font-weight: bold;
        color: #120d0d;
      }

      .graph {
        width: 100%;
        height: 250px;
        border: 2px solid #333;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <h1>Выставка "Изоморфизм"</h1>

    <div class="main-container">
      <div class="sample-row">
        <div class="sample-container">
          <div class="graph-title">Sample</div>
          <div id="sample" class="graph"></div>
        </div>
      </div>

      <div class="graphs-container">
        <!-- Левая колонка -->
        <div class="left-column">
          <div class="graph-container" data-graph="1">
            <div class="graph-title">Граф 1</div>
            <div id="graph1" class="graph"></div>
          </div>

          <div class="graph-container" data-graph="2">
            <div class="graph-title">Граф 2</div>
            <div id="graph2" class="graph"></div>
          </div>

          <div class="graph-container" data-graph="3">
            <div class="graph-title">Граф 3</div>
            <div id="graph3" class="graph"></div>
          </div>
        </div>

        <!-- Правая колонка -->
        <div class="right-column">
          <div class="graph-container" data-graph="4">
            <div class="graph-title">Граф 4</div>
            <div id="graph4" class="graph"></div>
          </div>

          <div class="graph-container" data-graph="5">
            <div class="graph-title">Граф 5</div>
            <div id="graph5" class="graph"></div>
          </div>

          <div class="graph-container" data-graph="6">
            <div class="graph-title">Граф 6</div>
            <div id="graph6" class="graph"></div>
          </div>
        </div>
      </div>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        // // Функция для обработки кликов
        // function setupContainerClicks() {
        //   // Находим все контейнеры с графами (6 нижних)
        //   const graphContainers = document.querySelectorAll('.graph-container[data-graph]');

        //   // Обрабатываем каждый контейнер
        //   graphContainers.forEach(container => {
        //     container.addEventListener('click', function() {
        //       // toggleClass - если класс есть - удаляет, если нет - добавляет
        //       container.classList.toggle('selected');

        //       const graphNumber = container.getAttribute('data-graph');
        //       const isSelected = container.classList.contains('selected');
        //     });
        //   });
        // }

        // Функция для создания графа
        function createGraph(containerId, title) {
          const graph = cytoscape({
            container: document.getElementById(containerId),
            style: [
              {
                selector: "node",
                style: {
                  "background-color": "#3CA0D0",
                  width: 20,
                  height: 20,
                  "font-size": "10px",
                },
              },
              {
                selector: "edge",
                style: {
                  width: 3,
                  "line-color": "#ccc",
                },
              },
            ],
          });

          // Добавляем узлы и ребра
          graph.add([
            { data: { id: "node1", label: "1" } },
            { data: { id: "node2", label: "2" } },
            { data: { id: "node3", label: "3" } },
            { data: { id: "node4", label: "4" } },
            { data: { id: "node5", label: "5" } },

            { data: { id: "edge1", source: "node1", target: "node2" } },
            { data: { id: "edge2", source: "node2", target: "node3" } },
            { data: { id: "edge3", source: "node3", target: "node4" } },
            { data: { id: "edge4", source: "node4", target: "node5" } },
            { data: { id: "edge5", source: "node1", target: "node4" } },
            { data: { id: "edge6", source: "node2", target: "node5" } },
          ]);

          // Располагаем узлы
          graph
            .layout({
              name: "random",
              boundingBox: {
                x1: 50,
                y1: 50,
                x2: 250,
                y2: 250,
              },
            })
            .run();

          // Интерактивность для узлов графа
          graph.on("mouseover", "node", function (event) {
            const node = event.target;
            node.style("background-color", "#086FA1");
            node.style({
              width: 25,
              height: 25,
            });
          });

          graph.on("mouseout", "node", function (event) {
            const node = event.target;
            if (!node.hasClass("selected")) {
              node.style("background-color", "#3CA0D0");
            }
            node.style({
              width: node.hasClass("selected") ? 25 : 20,
              height: node.hasClass("selected") ? 25 : 20,
            });
          });

          return graph;
        }

        // Настраиваем клики на контейнеры
        //setupContainerClicks();

        // Создаем все графы
        const graphs = [];
        graphs.push(createGraph("sample", "Sample"));
        for (let i = 1; i <= 6; ++i) {
          graphs.push(createGraph(`graph${i}`, `Граф ${i}`));
        }
      });
    </script>
  </body>
</html>
