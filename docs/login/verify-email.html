<!DOCTYPE html>
<html lang="ru">

<head>
    <link rel="apple-touch-icon" sizes="180x180" href="../img/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="../img/favicon-32x32.png" />
    <link rel="shortcut icon" href="../img/favicon.ico" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мастерская</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/tallur.css">
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .textrow {
            padding: 40px 19%;
            max-width: 480px;
            margin: 0 auto;
        }

        body {
            overflow: hidden;
        }

        h1 {
            font-size: 68px;
            line-height: 1.2;
            margin-bottom: 12px;
        }

        .remal {
            margin: 80px auto;
            width: 40%;
            max-width: none;
            position: relative;
            z-index: 3;
        }

        .subtitle {
            color: #aaa;
            font-size: 0.95em;
            margin-bottom: 8px;
            line-height: 1.5;
        }

        .code-inputs {
            display: flex;
            gap: 10px;
            margin: 24px 0;
        }

        .code-inputs input {
            width: 58px;
            height: 58px;
            text-align: center;
            font-size: 1.8em;
            font-family: "Golos Text", sans-serif;
            font-weight: 600;
            background: #1a1a1a;
            border: 1px solid #444444;
            border-radius: 4px;
            color: #fff;
            outline: none;
        }

        .code-inputs input:focus {
            box-shadow: 0 0 0 2px #02f0fe;
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: #ffbf69;
            border: none;
            border-radius: 4px;
            font-family: "Golos Text", sans-serif;
            font-size: 1em;
            font-weight: 600;
            color: #080808;
            cursor: pointer;
            transition: background 0.21s;
            margin-bottom: 12px;
        }

        .btn-primary:hover {
            background: #ff3266;
            color: #fff;
        }

        .btn-primary:disabled {
            background: #555;
            cursor: not-allowed;
        }

        .timer {
            margin-top: 20px;
            color: #aaa;
            font-size: 0.9em;
            text-align: center;
        }

        .resend-btn {
            background: none;
            border: none;
            color: #02f0fe;
            cursor: pointer;
            font-family: "Golos Text", sans-serif;
            font-size: 16px;
            border-bottom: 1px solid rgba(2, 240, 254, 0.5);
            padding: 0;
            display: none;
        }

        .resend-btn:hover {
            color: #ff3266;
            border-bottom: 1px #ff3266;
        }

        .error {
            color: #ff3266;
            font-size: 0.9em;
            margin-top: 12px;
            display: none;
        }
    </style>
</head>

<body>

    <div class="locker">
        <div class="cell pic">
            <img src="../img/handc.png">
            <a href="https://motovskikh.ru/" class="novisit">Леонид Мотовских</a>
        </div>
        <div class="cell">
            <a href="https://motovskikh.ru/thanks/" class="novisit">Задонатить</a>
        </div>
        <div class="cell">
            <a href="https://motovskikh.ru/en/" class="novisit">En</a>
        </div>
    </div>

    <div class="remal">
        <div class="textrow">
            <h1>Мастерская</h1>
            <p class="subtitle">Код подтверждения отправлен на почту <span id="email-display"></span></p>
            <p class="subtitle">Подтвердите свою почту в течение 1 часа.</p>

            <div class="code-inputs">
                <input type="text" maxlength="1" inputmode="numeric" />
                <input type="text" maxlength="1" inputmode="numeric" />
                <input type="text" maxlength="1" inputmode="numeric" />
                <input type="text" maxlength="1" inputmode="numeric" />
                <input type="text" maxlength="1" inputmode="numeric" />
                <input type="text" maxlength="1" inputmode="numeric" />
            </div>

            <button class="btn-primary" id="submit-btn">Продолжить</button>

            <div class="error" id="error-msg"></div>

            <div class="timer">
                <span id="timer-text">Получить новый код через: <span id="countdown">01:00</span></span>
                <button class="resend-btn" id="resend-btn">Получить новый код</button>
            </div>
        </div>
    </div>

    <script src="./js/shapes.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const email = params.get("email") || "";
        document.getElementById("email-display").textContent = email;

        const inputs = document.querySelectorAll(".code-inputs input");
        inputs.forEach((input, i) => {
            input.addEventListener("input", () => {
                input.value = input.value.replace(/\D/g, "");
                if (input.value && i < inputs.length - 1) {
                    inputs[i + 1].focus();
                }
            });
            input.addEventListener("keydown", (e) => {
                if (e.key === "Backspace" && !input.value && i > 0) {
                    inputs[i - 1].focus();
                }
            });
        });

        let timeLeft = 60;
        const countdown = document.getElementById("countdown");
        const resendBtn = document.getElementById("resend-btn");
        const timerText = document.getElementById("timer-text");

        const timer = setInterval(() => {
            timeLeft--;
            const mins = Math.floor(timeLeft / 60).toString().padStart(2, "0");
            const secs = (timeLeft % 60).toString().padStart(2, "0");
            countdown.textContent = mins + ":" + secs;
            if (timeLeft <= 0) {
                clearInterval(timer);
                timerText.style.display = "none";
                resendBtn.style.display = "inline";
            }
        }, 1000);

        resendBtn.addEventListener("click", async () => {
            resendBtn.disabled = true;
            try {
                await fetch("/api/auth/resend-code", {
                    method: "POST",
                    headers: { "Content-Type": "application/json; charset=utf-8" },
                    body: JSON.stringify({ email })
                });
                window.location.reload();
            } catch (err) {
                resendBtn.disabled = false;
            }
        });

        document.getElementById("submit-btn").addEventListener("click", async () => {
            const code = Array.from(inputs).map(i => i.value).join("");
            const btn = document.getElementById("submit-btn");
            const errorMsg = document.getElementById("error-msg");

            if (code.length < 6) {
                errorMsg.textContent = "Введите все 6 цифр кода";
                errorMsg.style.display = "block";
                return;
            }

            btn.disabled = true;
            btn.textContent = "Проверяем...";

            try {
                const response = await fetch("/api/auth/verify-email", {
                    method: "POST",
                    headers: { "Content-Type": "application/json; charset=utf-8" },
                    body: JSON.stringify({ email, code })
                });

                if (!response.ok) {
                    errorMsg.textContent = "Неверный или истёкший код";
                    errorMsg.style.display = "block";
                    btn.disabled = false;
                    btn.textContent = "Продолжить";
                    return;
                }

                window.location.href = "/login/dashboard.html";
            } catch (err) {
                errorMsg.textContent = "Ошибка соединения с сервером";
                errorMsg.style.display = "block";
                btn.disabled = false;
                btn.textContent = "Продолжить";
            }
        });
    </script>
</body>

</html>
