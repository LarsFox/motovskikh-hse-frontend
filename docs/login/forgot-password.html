<!DOCTYPE html>
<html lang="ru">

<head>
    <link rel="apple-touch-icon" sizes="180x180" href="../img/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="../img/favicon-32x32.png" />
    <link rel="shortcut icon" href="../img/favicon.ico" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мастерская</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/tallur.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        .textrow {
            padding: 40px;
            max-width: 480px;
            margin: 0 auto;
        }

        body {
            overflow: hidden;
            min-height: 100vh;
        }

        input[type="email"] {
            width: 100%;
            padding: 12px 14px;
            background: #080808;
            border: none;
            border-radius: 4px;
            font-family: "Golos Text", sans-serif;
            font-size: 25px;
            color: #fff;
            margin-bottom: 16px;
            outline: none;
        }

        h1 {
            font-size: 68px;
        }

        .subtitle {
            color: #aaa;
            font-size: 16px;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        input:focus {
            box-shadow: 0 0 0 2px #02f0fe;
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: #ffbf69;
            border: none;
            border-radius: 4px;
            font-family: "Golos Text", sans-serif;
            font-size: 1em;
            font-weight: 600;
            color: #080808;
            cursor: pointer;
            transition: background 0.21s;
            margin-bottom: 16px;
        }

        .btn-primary:hover {
            background: #ff3266;
            color: #fff;
        }

        .btn-primary:disabled {
            background: #555;
            cursor: not-allowed;
        }

        .error {
            color: #ff3266;
            font-size: 15px;
            margin-top: 12px;
            display: none;
        }
    </style>
</head>

<body>
    <div class="locker">
        <div class="cell pic">
            <img src="../img/handc.png">
            <a href="https://motovskikh.ru/" class="novisit">Леонид Мотовских</a>
        </div>
        <div class="cell">
            <a href="https://motovskikh.ru/thanks/" class="novisit">Задонатить</a>
        </div>
        <div class="cell">
            <a href="https://motovskikh.ru/en/" class="novisit">En</a>
        </div>
    </div>

    <div class="remal">
        <div class="textrow">
            <h1>Мастерская</h1>
            <p class="subtitle">Введите почту, привязанную к аккаунту.<br>Мастеркая отправит код для сброса пароля.</p>

            <form id="forgot-form">
                <input type="email" id="email" placeholder="your@email.com" required />
                <button type="submit" class="btn-primary" id="submit-btn">Продолжить</button>
            </form>

            <div class="error" id="error-msg"></div>
        </div>
    </div>

    <script src="./js/shapes.js"></script>
    <script>
        document.getElementById("forgot-form").addEventListener("submit", async function (e) {
            e.preventDefault();

            const email = document.getElementById("email").value.trim();
            const btn = document.getElementById("submit-btn");
            const errorMsg = document.getElementById("error-msg");

            errorMsg.style.display = "none";
            btn.disabled = true;
            btn.textContent = "Отправляем...";

            try {
                const response = await fetch("/api/auth/forgot-password", {
                    method: "POST",
                    headers: { "Content-Type": "application/json; charset=utf-8" },
                    body: JSON.stringify({ email })
                });

                if (!response.ok) {
                    errorMsg.textContent = "Не удалось отправить код. Проверьте email.";
                    errorMsg.style.display = "block";
                    btn.disabled = false;
                    btn.textContent = "Продолжить";
                    return;
                }

                window.location.href = "/login/reset-password.html?email=" + encodeURIComponent(email);

            } catch (err) {
                errorMsg.textContent = "Ошибка соединения с сервером";
                errorMsg.style.display = "block";
                btn.disabled = false;
                btn.textContent = "Продолжить";
            }
        });
    </script>
</body>

</html>
